<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" width="1400" height="1120" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
    <marker id="d" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1400" height="1120" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Live speech-to-text on CPU: current solution and scaling plan</text>
  <text x="700" y="58" text-anchor="middle" font-size="13" fill="#475569">One call leg = one WebSocket stream. Model: Qwen3-ASR-0.6B, CPU only. Solid = built and measured, dashed = proposed, not built.</text>

  <!-- ============ A. CURRENT ============ -->
  <text x="30" y="96" font-size="17" font-weight="700" fill="#0f172a">A. Current solution (built, measured on one laptop)</text>

  <!-- browser -->
  <rect x="30" y="110" width="310" height="380" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Web UI (React + Vite)</text>
  <rect x="48" y="150" width="274" height="50" rx="6" fill="#fff" stroke="#93c5fd"/><text x="185" y="171" text-anchor="middle" font-size="13">1. Select WAV file</text><text x="185" y="188" text-anchor="middle" font-size="11" fill="#475569">header check: 16 kHz, mono, 16-bit PCM</text>
  <rect x="48" y="210" width="274" height="50" rx="6" fill="#fff" stroke="#93c5fd"/><text x="185" y="231" text-anchor="middle" font-size="13">2. Cut into 2 s chunks (64 KB)</text><text x="185" y="248" text-anchor="middle" font-size="11" fill="#475569">sent at real-time speed</text>
  <rect x="48" y="270" width="274" height="50" rx="6" fill="#fff" stroke="#93c5fd"/><text x="185" y="291" text-anchor="middle" font-size="13">3. WebSocket client</text><text x="185" y="308" text-anchor="middle" font-size="11" fill="#475569">start, binary PCM frames, end</text>
  <rect x="48" y="345" width="274" height="132" rx="6" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="185" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">4. Results shown live</text>
  <text x="185" y="389" text-anchor="middle" font-size="12">Transcript (grey = may still change)</text>
  <text x="185" y="408" text-anchor="middle" font-size="12">Progress and status</text>
  <text x="185" y="427" text-anchor="middle" font-size="12">Latency: first text, final, lag</text>
  <text x="185" y="446" text-anchor="middle" font-size="12">RTF, model time, server CPU / RAM</text>
  <text x="185" y="465" text-anchor="middle" font-size="12">Clear error messages</text>
  <line x1="185" y1="320" x2="185" y2="345" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>

  <!-- websocket -->
  <rect x="372" y="250" width="170" height="130" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="457" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">WebSocket</text>
  <text x="457" y="294" text-anchor="middle" font-size="12" fill="#713f12">/ws/stream</text>
  <text x="457" y="318" text-anchor="middle" font-size="11" fill="#713f12">up: start, PCM frames, end</text>
  <text x="457" y="336" text-anchor="middle" font-size="11" fill="#713f12">down: ready, status, partial,</text>
  <text x="457" y="352" text-anchor="middle" font-size="11" fill="#713f12">final, error (JSON)</text>
  <line x1="340" y1="285" x2="372" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="372" y1="350" x2="340" y2="350" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/>

  <!-- backend -->
  <rect x="574" y="110" width="796" height="380" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="972" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Backend: Python, FastAPI + Uvicorn (one process)</text>
  <line x1="542" y1="285" x2="592" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="592" y1="350" x2="542" y2="350" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/>

  <rect x="592" y="152" width="250" height="68" rx="6" fill="#fff" stroke="#94a3b8"/><text x="717" y="174" text-anchor="middle" font-size="13" font-weight="700">websocket.py</text><text x="717" y="192" text-anchor="middle" font-size="11" fill="#475569">validates start, receives frames,</text><text x="717" y="207" text-anchor="middle" font-size="11" fill="#475569">rejects with server_busy when full</text>
  <rect x="1100" y="152" width="252" height="68" rx="6" fill="#fff" stroke="#94a3b8"/><text x="1226" y="174" text-anchor="middle" font-size="13" font-weight="700">routes.py (REST)</text><text x="1226" y="192" text-anchor="middle" font-size="11" fill="#475569">/api/health, /api/info,</text><text x="1226" y="207" text-anchor="middle" font-size="11" fill="#475569">/api/transcribe (whole file, tests)</text>
  <line x1="717" y1="220" x2="717" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="592" y="248" width="250" height="82" rx="6" fill="#fff" stroke="#94a3b8"/><text x="717" y="270" text-anchor="middle" font-size="13" font-weight="700">StreamSession (per call leg)</text><text x="717" y="289" text-anchor="middle" font-size="11" fill="#475569">buffers PCM, counts chunks,</text><text x="717" y="304" text-anchor="middle" font-size="11" fill="#475569">length limit, cleanup on disconnect</text>
  <line x1="842" y1="289" x2="880" y2="289" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="880" y="248" width="250" height="82" rx="6" fill="#fff" stroke="#94a3b8"/><text x="1005" y="270" text-anchor="middle" font-size="13" font-weight="700">StreamTranscriber</text><text x="1005" y="289" text-anchor="middle" font-size="11" fill="#475569">every 2 s of new audio: re-transcribe</text><text x="1005" y="304" text-anchor="middle" font-size="11" fill="#475569">current segment (max 10 s, cut at a</text><text x="1005" y="319" text-anchor="middle" font-size="11" fill="#475569">quiet point); emit partial / final</text>

  <rect x="1160" y="248" width="192" height="82" rx="6" fill="#fff" stroke="#94a3b8"/><text x="1256" y="270" text-anchor="middle" font-size="13" font-weight="700">metrics_service</text><text x="1256" y="289" text-anchor="middle" font-size="11" fill="#475569">inference time, queue wait,</text><text x="1256" y="304" text-anchor="middle" font-size="11" fill="#475569">CPU, RAM sampling</text>
  <line x1="1130" y1="289" x2="1160" y2="289" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <line x1="1005" y1="330" x2="1005" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="880" y="360" width="250" height="42" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="1005" y="379" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Inference slot (semaphore = 1)</text><text x="1005" y="394" text-anchor="middle" font-size="11" fill="#7c2d12">worker thread; other streams queue</text>
  <line x1="1005" y1="402" x2="1005" y2="418" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="740" y="418" width="530" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1005" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">ASR model: Qwen3-ASR-0.6B (Transformers, PyTorch CPU, float32)</text>
  <text x="1005" y="460" text-anchor="middle" font-size="11" fill="#7f1d1d">audio encoder + LLM decoder, about 3.6 GB RAM, about 6 busy cores per inference, offline-only model</text>
  <rect x="592" y="360" width="130" height="120" rx="6" fill="#fff" stroke="#94a3b8"/><text x="657" y="392" text-anchor="middle" font-size="12" font-weight="700">audio_service</text><text x="657" y="410" text-anchor="middle" font-size="11" fill="#475569">WAV header check,</text><text x="657" y="425" text-anchor="middle" font-size="11" fill="#475569">PCM to float32,</text><text x="657" y="440" text-anchor="middle" font-size="11" fill="#475569">format errors</text>

  <text x="705" y="512" text-anchor="middle" font-size="12" fill="#15803d">text returns up the same path: model, transcriber, WebSocket, UI</text>

  <!-- measured badge -->
  <rect x="30" y="524" width="1340" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="700" y="549" text-anchor="middle" font-size="13" fill="#7f1d1d">Measured: first text about 3 s, final about 6.5 s after the last audio. 1 stream within target (2 with a 4 s update interval). CPU is the bottleneck, memory is not.</text>

  <!-- ============ B. SCALING ============ -->
  <text x="30" y="608" font-size="17" font-weight="700" fill="#0f172a">B. Scaling plan for many simultaneous calls (proposed, not built; sizing is estimated)</text>

  <!-- clients -->
  <rect x="30" y="624" width="160" height="290" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="110" y="652" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Call legs</text>
  <rect x="48" y="668" width="124" height="32" rx="6" fill="#fff" stroke="#93c5fd"/><text x="110" y="689" text-anchor="middle" font-size="12">call leg 1</text>
  <rect x="48" y="710" width="124" height="32" rx="6" fill="#fff" stroke="#93c5fd"/><text x="110" y="731" text-anchor="middle" font-size="12">call leg 2</text>
  <text x="110" y="768" text-anchor="middle" font-size="16" fill="#475569">...</text>
  <rect x="48" y="782" width="124" height="32" rx="6" fill="#fff" stroke="#93c5fd"/><text x="110" y="803" text-anchor="middle" font-size="12">call leg N</text>
  <text x="110" y="850" text-anchor="middle" font-size="11" fill="#475569">one WebSocket</text><text x="110" y="866" text-anchor="middle" font-size="11" fill="#475569">per call leg</text>

  <line x1="190" y1="770" x2="222" y2="770" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="222" y="700" width="160" height="140" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="302" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Load balancer</text>
  <text x="302" y="750" text-anchor="middle" font-size="11" fill="#713f12">WebSocket aware, TLS,</text><text x="302" y="766" text-anchor="middle" font-size="11" fill="#713f12">sticky per stream,</text><text x="302" y="782" text-anchor="middle" font-size="11" fill="#713f12">health checks,</text><text x="302" y="798" text-anchor="middle" font-size="11" fill="#713f12">rejects when full</text>

  <line x1="382" y1="770" x2="414" y2="770" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="414" y="624" width="190" height="290" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="509" y="652" text-anchor="middle" font-size="14" font-weight="700">Gateways (stateless)</text>
  <rect x="432" y="668" width="154" height="56" rx="6" fill="#fff" stroke="#94a3b8"/><text x="509" y="690" text-anchor="middle" font-size="12">gateway 1</text><text x="509" y="708" text-anchor="middle" font-size="11" fill="#475569">hold sockets, validate</text>
  <rect x="432" y="734" width="154" height="56" rx="6" fill="#fff" stroke="#94a3b8"/><text x="509" y="756" text-anchor="middle" font-size="12">gateway 2</text><text x="509" y="774" text-anchor="middle" font-size="11" fill="#475569">hold sockets, validate</text>
  <text x="509" y="812" text-anchor="middle" font-size="16" fill="#475569">...</text>
  <text x="509" y="846" text-anchor="middle" font-size="11" fill="#475569">cut audio into jobs,</text><text x="509" y="862" text-anchor="middle" font-size="11" fill="#475569">return text to the call</text><text x="509" y="884" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">scale on connections</text>

  <line x1="604" y1="770" x2="636" y2="770" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="636" y="700" width="160" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="716" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Job queue</text>
  <text x="716" y="750" text-anchor="middle" font-size="11" fill="#4c1d95">audio windows,</text><text x="716" y="766" text-anchor="middle" font-size="11" fill="#4c1d95">per-stream order,</text><text x="716" y="782" text-anchor="middle" font-size="11" fill="#4c1d95">admission control,</text><text x="716" y="798" text-anchor="middle" font-size="11" fill="#4c1d95">oldest-first</text>

  <line x1="796" y1="770" x2="828" y2="770" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="828" y="624" width="330" height="290" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="993" y="652" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">ASR worker pool (CPU nodes)</text>
  <rect x="846" y="668" width="294" height="60" rx="6" fill="#fff" stroke="#fca5a5"/><text x="993" y="690" text-anchor="middle" font-size="12" font-weight="700">worker 1 (today's worker, unchanged)</text><text x="993" y="708" text-anchor="middle" font-size="11" fill="#475569">1 model, 6 pinned cores, about 4 GB, about 2 calls</text>
  <rect x="846" y="738" width="294" height="60" rx="6" fill="#fff" stroke="#fca5a5"/><text x="993" y="760" text-anchor="middle" font-size="12" font-weight="700">worker 2 ... K</text><text x="993" y="778" text-anchor="middle" font-size="11" fill="#475569">4 per 48 vCPU / 32 GB node, nodes added as needed</text>
  <rect x="846" y="808" width="294" height="90" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-dasharray="5 3"/><text x="993" y="830" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Per-worker upgrades (to test)</text><text x="993" y="848" text-anchor="middle" font-size="11" fill="#4c1d95">native / incremental streaming, silence skipping,</text><text x="993" y="864" text-anchor="middle" font-size="11" fill="#4c1d95">C++ runtime (1.5-2.5x faster, 1/3 RAM, but</text><text x="993" y="880" text-anchor="middle" font-size="11" fill="#4c1d95">Indonesian accuracy needs a check first)</text>

  <!-- autoscaler / monitoring -->
  <rect x="1190" y="700" width="180" height="140" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="1280" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Autoscaler + metrics</text>
  <text x="1280" y="750" text-anchor="middle" font-size="11" fill="#064e3b">watches queue depth, lag,</text><text x="1280" y="766" text-anchor="middle" font-size="11" fill="#064e3b">CPU, active streams;</text><text x="1280" y="782" text-anchor="middle" font-size="11" fill="#064e3b">adds / removes workers</text><text x="1280" y="798" text-anchor="middle" font-size="11" fill="#064e3b">and gateways</text>
  <path d="M1190,770 L1158,770" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#d)"/>
  
  <!-- return path -->
  <path d="M993,914 L993,938 L509,938 L509,916" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="751" y="956" text-anchor="middle" font-size="12" fill="#15803d">transcript returns to the gateway that holds the call's socket</text>

  <!-- sizing -->
  <rect x="30" y="978" width="1340" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="50" y="1004" font-size="14" font-weight="700" fill="#0f172a">Why this shape, and what it costs</text>
  <text x="50" y="1026" font-size="12.5" fill="#0f172a">Measured: one inference fills about 6 cores while an extra stream adds only about 15 MB, so CPU decides the server count. Scale the model tier by adding workers; keep gateways cheap and separate.</text>
  <text x="50" y="1046" font-size="12.5" fill="#0f172a">A queue with admission control turns overload into "busy" for new calls rather than slow text for everyone (6 streams on one laptop: final latency 36 s, queue wait up to about 190 s).</text>
  <text x="50" y="1070" font-size="12.5" fill="#7c2d12">Estimates (linear scaling, 30% headroom): 50 calls = 33 workers / 9 nodes; 100 = 65 / 17; 500 = 325 / 82; 1,000 = 650 / 163. Estimated, not run.</text>
  <text x="50" y="1088" font-size="12.5" fill="#7c2d12">If per-worker upgrades reach 5 calls per worker (a hypothesis): 1,000 calls = about 260 workers / 65 nodes.</text>
</svg>
