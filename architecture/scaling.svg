<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
  <rect width="1100" height="660" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Proposed design for many simultaneous calls (not built; estimates only)</text>

  <rect x="30" y="70" width="190" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Call legs / clients</text>
  <rect x="55" y="115" width="140" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text x="125" y="137" text-anchor="middle" font-size="12">call leg 1</text>
  <rect x="55" y="159" width="140" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text x="125" y="181" text-anchor="middle" font-size="12">call leg 2</text>
  <text x="125" y="222" text-anchor="middle" font-size="18" fill="#475569">...</text>
  <rect x="55" y="240" width="140" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text x="125" y="262" text-anchor="middle" font-size="12">call leg N</text>
  <text x="125" y="310" text-anchor="middle" font-size="11" fill="#475569">one WebSocket</text><text x="125" y="326" text-anchor="middle" font-size="11" fill="#475569">per call leg</text>

  <line x1="220" y1="220" x2="262" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="262" y="150" width="170" height="140" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="347" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Load balancer</text>
  <text x="347" y="204" text-anchor="middle" font-size="12" fill="#713f12">WebSocket aware,</text><text x="347" y="222" text-anchor="middle" font-size="12" fill="#713f12">sticky per stream,</text><text x="347" y="240" text-anchor="middle" font-size="12" fill="#713f12">health checks,</text><text x="347" y="258" text-anchor="middle" font-size="12" fill="#713f12">rejects when full</text>

  <line x1="432" y1="220" x2="474" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="474" y="70" width="170" height="300" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="559" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Gateways (stateless)</text>
  <rect x="494" y="115" width="130" height="50" rx="6" fill="#fff" stroke="#94a3b8"/><text x="559" y="137" text-anchor="middle" font-size="12">gateway 1</text><text x="559" y="153" text-anchor="middle" font-size="11" fill="#475569">buffer, validate</text>
  <rect x="494" y="177" width="130" height="50" rx="6" fill="#fff" stroke="#94a3b8"/><text x="559" y="199" text-anchor="middle" font-size="12">gateway 2</text><text x="559" y="215" text-anchor="middle" font-size="11" fill="#475569">buffer, validate</text>
  <text x="559" y="252" text-anchor="middle" font-size="16" fill="#475569">...</text>
  <text x="559" y="290" text-anchor="middle" font-size="11" fill="#475569">keep the sockets, cut audio</text><text x="559" y="306" text-anchor="middle" font-size="11" fill="#475569">into jobs, return text</text><text x="559" y="334" text-anchor="middle" font-size="11" fill="#475569">scale on connections</text>

  <line x1="644" y1="220" x2="686" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="686" y="150" width="130" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="751" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Job queue</text>
  <text x="751" y="204" text-anchor="middle" font-size="12" fill="#4c1d95">audio windows,</text><text x="751" y="222" text-anchor="middle" font-size="12" fill="#4c1d95">per-stream order,</text><text x="751" y="240" text-anchor="middle" font-size="12" fill="#4c1d95">admission control,</text><text x="751" y="258" text-anchor="middle" font-size="12" fill="#4c1d95">oldest-first</text>

  <line x1="816" y1="220" x2="858" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="858" y="70" width="212" height="300" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="964" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">ASR worker pool (CPU)</text>
  <rect x="878" y="115" width="172" height="62" rx="6" fill="#fff" stroke="#fca5a5"/><text x="964" y="137" text-anchor="middle" font-size="12" font-weight="700">worker 1</text><text x="964" y="155" text-anchor="middle" font-size="11" fill="#475569">1 model, 6 pinned cores,</text><text x="964" y="169" text-anchor="middle" font-size="11" fill="#475569">about 4 GB RAM</text>
  <rect x="878" y="189" width="172" height="62" rx="6" fill="#fff" stroke="#fca5a5"/><text x="964" y="211" text-anchor="middle" font-size="12" font-weight="700">worker 2</text><text x="964" y="229" text-anchor="middle" font-size="11" fill="#475569">1 model, 6 pinned cores,</text><text x="964" y="243" text-anchor="middle" font-size="11" fill="#475569">about 4 GB RAM</text>
  <text x="964" y="276" text-anchor="middle" font-size="16" fill="#475569">...</text>
  <text x="964" y="316" text-anchor="middle" font-size="11" fill="#475569">scale on queue wait / lag</text><text x="964" y="332" text-anchor="middle" font-size="11" fill="#475569">several workers per node,</text><text x="964" y="348" text-anchor="middle" font-size="11" fill="#475569">autoscaled across nodes</text>
  <path d="M964,370 L964,400 L559,400 L559,372" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="760" y="418" text-anchor="middle" font-size="12" fill="#15803d">transcript text returns to the gateway that holds the call's socket</text>

  <rect x="30" y="450" width="1040" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="50" y="478" font-size="14" font-weight="700" fill="#0f172a">Why this shape (reasoned from the measurements)</text>
  <text x="50" y="502" font-size="13" fill="#0f172a">1. The bottleneck is CPU for inference: one inference already used about 6 cores, and memory per extra stream was only about 15 MB. So scale the model tier by adding workers.</text>
  <text x="50" y="524" font-size="13" fill="#0f172a">2. Separate the layers: gateways hold connections and are cheap, workers are expensive. Each can scale on its own signal (connections vs. queue wait).</text>
  <text x="50" y="546" font-size="13" fill="#0f172a">3. A queue plus admission control turns overload into "busy" for new calls instead of slow transcripts for everyone (queue wait grew from 0 s to about 190 s in the 6-stream test).</text>
  <text x="50" y="568" font-size="13" fill="#0f172a">4. Also reduce work per call: native or incremental streaming (about 2.5x less compute than re-transcribing), silence skipping, or a faster runtime. Not built, so gains are unproven.</text>
  <text x="50" y="596" font-size="13" fill="#7c2d12">Sizing (estimates, see reports/capacity_estimates.md): measured basis 2 calls per 12-vCPU worker, about 33 workers for 50 calls and 650 for 1,000 calls.</text>
  <text x="50" y="618" font-size="13" fill="#7c2d12">With the hypothetical 2.5x optimisation: about 13 and 260 workers.</text>
</svg>
