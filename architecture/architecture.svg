<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Current solution: live speech-to-text on CPU (one call leg = one WebSocket stream)</text>

  <!-- Browser -->
  <rect x="30" y="70" width="300" height="440" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Web UI (React + Vite)</text>
  <rect x="48" y="115" width="264" height="52" rx="6" fill="#fff" stroke="#93c5fd"/><text x="180" y="137" text-anchor="middle" font-size="13" fill="#0f172a">1. Select WAV file</text><text x="180" y="155" text-anchor="middle" font-size="12" fill="#475569">header check: 16 kHz, mono, 16-bit PCM</text>
  <rect x="48" y="177" width="264" height="52" rx="6" fill="#fff" stroke="#93c5fd"/><text x="180" y="199" text-anchor="middle" font-size="13" fill="#0f172a">2. Cut into chunks (default 2 s)</text><text x="180" y="217" text-anchor="middle" font-size="12" fill="#475569">64 KB each, sent at real-time speed</text>
  <rect x="48" y="239" width="264" height="52" rx="6" fill="#fff" stroke="#93c5fd"/><text x="180" y="261" text-anchor="middle" font-size="13" fill="#0f172a">3. WebSocket client</text><text x="180" y="279" text-anchor="middle" font-size="12" fill="#475569">start, binary PCM frames, end</text>
  <rect x="48" y="360" width="264" height="136" rx="6" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <text x="180" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">4. Results shown live</text>
  <text x="180" y="404" text-anchor="middle" font-size="12" fill="#0f172a">Transcript (grey = may still change)</text>
  <text x="180" y="424" text-anchor="middle" font-size="12" fill="#0f172a">Status and progress</text>
  <text x="180" y="444" text-anchor="middle" font-size="12" fill="#0f172a">Latency: first text, final text, lag</text>
  <text x="180" y="464" text-anchor="middle" font-size="12" fill="#0f172a">RTF, model time, server CPU / RAM</text>
  <text x="180" y="484" text-anchor="middle" font-size="12" fill="#0f172a">Clear error messages</text>

  <!-- connection -->
  <rect x="352" y="238" width="150" height="110" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="427" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">WebSocket</text>
  <text x="427" y="280" text-anchor="middle" font-size="12" fill="#713f12">/ws/stream</text>
  <text x="427" y="302" text-anchor="middle" font-size="11" fill="#713f12">up: start, PCM frames, end</text>
  <text x="427" y="320" text-anchor="middle" font-size="11" fill="#713f12">down: ready, status, partial,</text>
  <text x="427" y="336" text-anchor="middle" font-size="11" fill="#713f12">final, error (JSON)</text>
  <line x1="330" y1="265" x2="352" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="352" y1="330" x2="330" y2="330" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/>
  <line x1="180" y1="291" x2="180" y2="360" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>

  <!-- Backend -->
  <rect x="522" y="70" width="548" height="440" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="796" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Backend (Python, FastAPI + Uvicorn), one process</text>
  <line x1="502" y1="265" x2="540" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="330" x2="502" y2="330" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/>

  <rect x="540" y="115" width="240" height="70" rx="6" fill="#fff" stroke="#94a3b8"/><text x="660" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">websocket.py</text><text x="660" y="157" text-anchor="middle" font-size="12" fill="#475569">validates start message,</text><text x="660" y="173" text-anchor="middle" font-size="12" fill="#475569">receives frames, handles errors</text>
  <rect x="800" y="115" width="250" height="70" rx="6" fill="#fff" stroke="#94a3b8"/><text x="925" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">routes.py (REST)</text><text x="925" y="157" text-anchor="middle" font-size="12" fill="#475569">/api/health, /api/info,</text><text x="925" y="173" text-anchor="middle" font-size="12" fill="#475569">/api/transcribe (whole file, for tests)</text>
  <line x1="660" y1="185" x2="660" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="540" y="215" width="240" height="84" rx="6" fill="#fff" stroke="#94a3b8"/><text x="660" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">StreamSession (one per call leg)</text><text x="660" y="257" text-anchor="middle" font-size="12" fill="#475569">buffers PCM, counts chunks,</text><text x="660" y="273" text-anchor="middle" font-size="12" fill="#475569">limits (length, active streams),</text><text x="660" y="289" text-anchor="middle" font-size="12" fill="#475569">cleaned up on disconnect</text>
  <line x1="780" y1="257" x2="800" y2="257" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="800" y="215" width="250" height="84" rx="6" fill="#fff" stroke="#94a3b8"/><text x="925" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">StreamTranscriber</text><text x="925" y="257" text-anchor="middle" font-size="12" fill="#475569">every 2 s of new audio: transcribe</text><text x="925" y="273" text-anchor="middle" font-size="12" fill="#475569">current segment (max 10 s, cut at a</text><text x="925" y="289" text-anchor="middle" font-size="12" fill="#475569">quiet point); send partial / final</text>
  <line x1="925" y1="299" x2="925" y2="332" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="800" y="332" width="250" height="52" rx="6" fill="#fff7ed" stroke="#ea580c"/><text x="925" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Inference slot (semaphore = 1)</text><text x="925" y="372" text-anchor="middle" font-size="12" fill="#7c2d12">runs in a worker thread, others queue</text>
  <line x1="925" y1="384" x2="925" y2="410" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="640" y="410" width="410" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="845" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">ASR model: Qwen3-ASR-0.6B</text><text x="845" y="456" text-anchor="middle" font-size="12" fill="#7f1d1d">Hugging Face Transformers, PyTorch CPU, float32 (no GPU)</text><text x="845" y="474" text-anchor="middle" font-size="12" fill="#7f1d1d">audio encoder + language-model decoder, about 3.6 GB RAM</text>
  <rect x="540" y="332" width="240" height="52" rx="6" fill="#fff" stroke="#94a3b8"/><text x="660" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">metrics_service</text><text x="660" y="372" text-anchor="middle" font-size="12" fill="#475569">inference time, queue wait, CPU, RAM</text>
  <rect x="540" y="410" width="80" height="84" rx="6" fill="#fff" stroke="#94a3b8"/><text x="580" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">audio_</text><text x="580" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">service</text><text x="580" y="476" text-anchor="middle" font-size="11" fill="#475569">WAV / PCM</text>
    <text x="845" y="529" text-anchor="middle" font-size="12" fill="#15803d">text returns up the same path: model, then transcriber, then WebSocket, then UI</text>

  <!-- explanation strip -->
  <rect x="30" y="560" width="1040" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="50" y="586" font-size="14" font-weight="700" fill="#0f172a">How it works</text>
  <text x="50" y="608" font-size="13" fill="#0f172a">Chunk size (how audio is sent, 2 s) and processing window (what the model reads each time, up to 10 s) are separate things.</text>
  <text x="50" y="629" font-size="13" fill="#0f172a">The Transformers model is offline-only, so streaming is application-level: the server re-transcribes the current segment as audio arrives</text>
  <text x="50" y="650" font-size="13" fill="#0f172a">(partial text, may still change), commits finished segments at quiet points, and sends the final text when the stream ends.</text>
  <text x="50" y="678" font-size="13" fill="#0f172a">Measured on a 6-core / 12-thread laptop: first text about 3 s; 1 stream within the latency target (2 with a 4 s update interval); memory about 3.8 GB; CPU is the bottleneck.</text>
</svg>
